name: Novena Sync app

# Builds the optional desktop companion from the tagged source, for Windows and macOS, and attaches the builds and
# their SHA-256 checksums to the GitHub release, so anyone can check a download matches this code.
on:
  push:
    tags: ["sync-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sync
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the app (runtime only), then list its third-party licenses
        run: |
          pip install . pip-licenses
          pip-licenses --with-license-file --no-license-path --format=plain-vertical \
            --ignore-packages novena-sync pip-licenses prettytable wcwidth pip setuptools > NOTICES.txt
      - name: Install test and build tools
        run: pip install ".[dev,build]"
      - name: Tests
        run: python -m pytest -q
      - name: Build
        run: pyinstaller novena-sync.spec
      # Code signing goes here once there's a certificate (Windows: Azure Trusted Signing; macOS: Developer ID + notarize).
      - name: Package
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "../novena-sync-${{ matrix.name }}.zip" "Novena Sync"
          else ditto -c -k --keepParent "Novena Sync.app" "../novena-sync-${{ matrix.name }}.zip"; fi
          cd ..
          if command -v sha256sum >/dev/null; then sha256sum novena-sync-*.zip; else shasum -a 256 novena-sync-*.zip; fi > "SHA256SUMS-${{ matrix.name }}.txt"
          cat "SHA256SUMS-${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: novena-sync-${{ matrix.name }}
          path: |
            sync/novena-sync-*.zip
            sync/SHA256SUMS-*.txt
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#sync-v}" >> "$GITHUB_ENV"
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Novena Sync ${{ env.VERSION }}
          body_path: sync/RELEASE.md
          files: |
            sync/novena-sync-*.zip
            sync/SHA256SUMS-*.txt
