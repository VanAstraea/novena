<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Novena · Arknights companion</title>
    <meta name="description" content="A free, open-source Arknights companion: operator database, compare, upgrade and farming planners, recruitment calculator. No account, no tracking; your data stays in your browser." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#14171c" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 30 16 16 30 2 16z' fill='%2333c3d6'/%3E%3Cpath d='M16 9 23 16 16 23 9 16z' fill='%2314171c'/%3E%3C/svg%3E" />
    <link rel="preload" href="/fonts/saira-100-900-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the saved theme before first paint (no flash). Storage may be blocked: fall back to the system theme.
      try { var t = localStorage.getItem("novena.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Novena needs JavaScript: every calculation runs in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
